<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Zona</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  /* Esta ventana cubre TODA la pantalla y es clic-a-través en todos lados
     EXCEPTO sobre el recuadro (#box) — así el recuadro nunca puede salirse
     de la pantalla: es un <div> normal, posicionado en % del propio
     tamaño de esta ventana (que es exactamente el de la pantalla), no
     coordenadas absolutas que se puedan ir de rango. */
  #box {
    position: absolute;
    box-sizing: border-box;
    border: 3px solid #6E6E78;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 0 0 1px rgba(0,0,0,0.4);
    cursor: move;
    display: flex; align-items: center; justify-content: center;
    color: #EDEDEF;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    text-align: center;
  }
  .hint { pointer-events: none; opacity: 0.8; padding: 10px; }
  #handle {
    position: absolute; right: -3px; bottom: -3px;
    width: 16px; height: 16px;
    background: #6E6E78;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 4px;
    cursor: nwse-resize;
  }
</style>
</head>
<body>
  <div id="box">
    <div class="hint">Arrastra para mover · agarra la esquina para redimensionar<br/>Este es tu espacio libre — no cubre nada, es solo una guía mientras editas.</div>
    <div id="handle"></div>
  </div>

  <script>
    // Mínimos razonables por si main.js todavía no mandó el valor real.
    let zone = { crossStart: 0, crossSize: 0.3, topFrac: 0.5 };
    let limits = { ZONE_MIN: 0.064, TOP_FRAC_MAX: 0.80, MIN_SCHEDULE_FRAC: 0.13 };
    const box = document.getElementById('box');
    const handle = document.getElementById('handle');

    // Esto existía en la app original de una sola ventana y se perdió en
    // la migración a multi-ventana: en vez de dejar que el panel extra
    // (izquierda) se angoste gradualmente hasta ser una franja diminuta e
    // inútil, el arrastre "engancha" directo a 0 (oculto) o al mínimo
    // usable — por eso antes se sentía como que no había límite
    // izquierdo: cualquier valor pequeñísimo quedaba permitido.
    function lockCrossStart(cs) {
      if (cs <= 0) return 0;
      if (cs >= limits.MIN_SCHEDULE_FRAC) return cs;
      return cs > limits.MIN_SCHEDULE_FRAC / 2 ? limits.MIN_SCHEDULE_FRAC : 0;
    }

    function paint() {
      box.style.left = (zone.crossStart * 100) + '%';
      box.style.top = '0%';
      box.style.width = (zone.crossSize * 100) + '%';
      box.style.height = (zone.topFrac * 100) + '%';
    }
    paint();

    // Clic-a-través en toda la ventana, EXCEPTO sobre el recuadro — así
    // se puede seguir interactuando con lo que esté detrás (paneles reales,
    // escritorio) en cualquier otra parte de la pantalla.
    let lastIgnore = null;
    document.addEventListener('mousemove', (e) => {
      const r = box.getBoundingClientRect();
      const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (inside !== lastIgnore) { lastIgnore = inside; window.api.zoneEditorSetIgnore(!inside); }
    });

    // Arrastrar el cuerpo: reposiciona horizontalmente (crossStart). El
    // mismo mínimo lateral (MIN_SCHEDULE_FRAC) que aplica main.js de
    // verdad al cronograma, para que el recuadro nunca prometa una
    // posición que después se recorte distinto.
    box.addEventListener('mousedown', (e) => {
      if (e.target === handle) return;
      e.preventDefault();
      const startX = e.clientX;
      const startCrossStart = zone.crossStart;
      const winWidth = window.innerWidth;
      function onMove(ev) {
        const deltaFrac = (ev.clientX - startX) / winWidth;
        const maxCrossStart = Math.max(0, 1 - zone.crossSize - limits.MIN_SCHEDULE_FRAC);
        zone.crossStart = lockCrossStart(Math.max(0, Math.min(maxCrossStart, startCrossStart + deltaFrac)));
        paint();
        window.api.zoneLiveUpdate(zone);
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        window.api.zoneEndUpdate(zone);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    // Esquina inferior derecha: redimensiona ancho (crossSize) y alto
    // (topFrac) — mismos límites que ZONE_MIN/TOP_FRAC_MAX/MIN_SCHEDULE_FRAC
    // de main.js, no aproximaciones propias.
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const winWidth = window.innerWidth;
      const winHeight = window.innerHeight;
      function onMove(ev) {
        const r = box.getBoundingClientRect();
        const maxCrossSize = Math.max(limits.ZONE_MIN, 1 - zone.crossStart - limits.MIN_SCHEDULE_FRAC);
        zone.crossSize = Math.max(limits.ZONE_MIN, Math.min(maxCrossSize, (ev.clientX - r.left) / winWidth));
        zone.topFrac = Math.max(limits.ZONE_MIN, Math.min(limits.TOP_FRAC_MAX, (ev.clientY - r.top) / winHeight));
        paint();
        window.api.zoneLiveUpdate(zone);
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        window.api.zoneEndUpdate(zone);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    window.api.onDataChanged('zone-editor-init', (payload) => {
      zone = payload.zone;
      limits = payload.limits;
      paint();
    });
  </script>
</body>
</html>
